<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-Register popup</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       
        #login-popup
        {
            width: 300px;
    height: 200px;
border: 1px solid rgb(58, 46, 163);
display: none;
margin:auto;
flex-direction: column;
margin-top: 100px;
z-index: 1;
background-color: #f0f0f0;
     border-radius: 5px;
    padding: 10px 25px 15px 25px;
        }
        #register-popup
        {
            width: 300px;
    height: 300px;
border: 1px solid rgb(199, 26, 26);
display: none;
margin:auto;
flex-direction: column;
margin-top: 50px;
z-index: 1;
background-color: #f0f0f0;
     border-radius: 5px;
    padding: 5px 10px 10px 5px;
        }
        #forgot-popup
        {
            width: 300px;
    height: 250px;
border: 1px solid rgb(3, 3, 3);
display: none;
margin:auto;
flex-direction: column;
margin-top: 100px;
z-index: 1;

        }

      .popup{
    background-color: #f0f0f0;
     border-radius: 5px;
    padding: 20px 25px 30px 25px;
    width: 100%;
    height: 100%;
}
.popup h2{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
    color: #30475e;
    border: none;
    background-color: transparent;
    outline: none;
    font-size: 18px;
    font-weight: 550;
  
}
.login-btn
{
    margin-bottom: 15px;
}

.popup input{
    width: 100%;
    margin-bottom: 8px;
    background-color: transparent;
    border: none;
    border-bottom: 1px solid #30475e;
    border-radius: 0px;
    padding: 2px 0;
    font-size: 12px;
    outline: none;
}

    </style>
</head>
<body>
    <button class="login-button" onclick="popupbox('login-popup')">Login</button>
    <button class="register-button" onclick="popupbox('register-popup')">Register</button>
  <div id="login-popup">
    <div class="login popup">
        <form action="login.php" method="POST">
            <h2>
                <span>User Login</span>
                <button type="reset" onclick="popupbox('login-popup')">X</button>
            </h2>
            <input type="text" placeholder="E-mail or Username" name="email_username" required>
            <input type="password" placeholder="Password" name="password" required>
            <button type="submit" class="login-btn" name="login">Login</button>
        </form>
    
     <button onclick="popupbox('forgot-popup')">Forget password?</button>
    </div>
  </div>  
  <div id="register-popup">
    <div class="register popup">
        <form action="register.php" method="POST" enctype="multipart/form-data" onsubmit="return validateform()">
                <h2>
                    <span>User REGISTER</span>
                    <button type="reset" onclick="popupbox('register-popup')">X</button>
                </h2>
                 <label for="image">Upload profile:</label> 
                <input type="file" name="profile" >
                <input type="text" placeholder="First NAME" name="fname" required>
                <input type="text" placeholder="Last NAME" name="fname" required>
                <input type="text" placeholder="User Name" id="username" name="username">
                <input type="email" placeholder="E-mail"  id="email" name="email">
                <input type="password" placeholder="Password"  id="password" name="password">
                <button type="submit" class="register-btn" name="register">Register</button>
            </form>
        </div>
  </div> 
  <div id="forgot-popup">
    <div class="forgot popup">
        <form action="forgotpassword.php" method="POST">
            <h2>
                <span>Reset Password</span>
                <button type="reset" onclick="popup('forgot-popup')">X</button>
            </h2>
            <input type="email" placeholder="E-mail" name="email">
            
            <button type="submit" class="reset-btn" name="send-reset-link">Send Link</button>
        </form>
        
    </div>
</div>
  <script>
    function popupbox(popupname)
    {
let x=document.getElementById(popupname);
if(x.style.display=="none")
{
    x.style.display="flex";
}
else{
    x.style.display="none";
}
    }
  </script> 
</body>
</html>
