<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup box</title>
    <style>
#popup
{
    width: 300px;
    height: 250px;
border: 1px solid black;
display: flex;
margin:auto;
flex-direction: column;
margin-top: 100px;
z-index: 1;
}


    </style>
</head>
<body>
    <button class="button" onclick='popupbox()'>Click me</button>
    <div id="popup">

    </div>
    <script>
function popupbox()
{
let x=document.getElementById('popup');
if(x.style.display=="none")
{
    x.style.display="flex";
}
else{
    x.style.display="none";
}
}
    </script>
</body>
</html>
