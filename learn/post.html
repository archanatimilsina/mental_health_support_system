<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/c5a4938a4c.js" crossorigin="anonymous"></script>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .post-containeer
        {
            width: 96%;
            margin: auto;
            border: 1px solid black;
            height: 250px;
        }
        .post-head
        {
            border: 1px solid black;
            width: 100%;
            height: 30%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            position: relative;
        }
        .post-body 
        {
            border: 1px solid black;
            width: 100%;
            height: 60%;
        }
        .post-footer
        {
            width: 100%;
            height: 10%;
            border: 1px solid black;
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        .hprofile
        {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 2px;
            border: 1px solid black; 
        }
        .hname
        {
            width: 20%;
            height:70px;
            border: 1px solid black; 
            position: absolute;
            left: 73px;
            margin-top: 2px;
            display: flex;
            flex-direction: column;
        }
        .three-dot
        {
            width: 5%;
            height: 25%;
            border: 1px solid black; 
           position: absolute;
           top: 35px;
           right: 0px;
        }
.pname
{
width: fit-content;
height: fit-content;
font-size: 20px;
}
.paccount-type
{
    width: fit-content;
    height: fit-content;
    font-size: 14px;
}
.post-time
{
    width: fit-content;
    height: fit-content;
    font-size: 10px;
}
.star
{
   width: 10%;
    height: 100%;
   /* margin-left: 5px; */
    border: 1px solid black;
    /* margin-top: 3px; */
    display: flex;
    flex-direction: row;
}
.star-icon
{
    width: 50%;
    height: 100%;
    border: 1px solid black;
}
.star-count
{
    width: 50%;
    height: 100%;

    border: 1px solid black;
}
.comment
{
    width: 10%;
    height: 100%;
    border: 1px solid black;
    margin-left: 20px;
    display: flex;
    flex-direction: row;
}
.comment-icon
{
    width: 50%;
    height: 100%;
    border: 1px solid black;
}
.comment-count
{
    width: 50%;
    height: 100%;
    border: 1px solid black;
}
    </style>
</head>
<body>
    <div class="post-containeer">
        <div class="post-head">
            <div class="ph hprofile"></div>
            <div class="ph hname">
                <div class="ainfo pname">Archana Timilsina</div>
                <div class="ainfo paccount-type">Professionals</div>
                <div class="ainfo post-time">2082/02/26 7:29 PM</div>

            </div>
            <div class="ph three-dot"><i class="fa-solid fa-three-dots fa-sm"></i></div>
        </div>
        <div class="post-body">

        </div>
        <div class="post-footer">
            <div class="star">
                <div class="star-icon">
                    <i class="fa-solid fa-star fa-sm"></i>
                </div>
                <div class="star-count"></div>
            </div>
            <div class="comment">
                <div class="comment-icon"><i class="fa-solid fa-comment fa-sm" style="color: #63E6BE;" title="Open Chatbox"></i></div>
                <div class="comment-count"></div>
            </div>
        </div>
    </div>
</body>
</html>
